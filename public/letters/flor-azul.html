5C\" stroke-width=\"1.6\" stroke-linejoin=\"round\"><\u002Fpath>\n<\u002Fsymbol>\n<symbol id=\"heart\" sc-camel-view-box=\"0 0 24 24\">\n<path d=\"M12 21s-8-5.3-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.7-8 11-8 11z\" fill=\"#FF9CB3\" stroke=\"#4A3F5C\" stroke-width=\"1.6\" stroke-linejoin=\"round\"><\u002Fpath>\n<\u002Fsymbol>\n<\u002Fsvg>\n\n<div style=\"position: relative; display: flex; align-items: flex-end; justify-content: space-between; gap: 16px\">\n<svg aria-hidden=\"true\" width=\"150\" height=\"150\" sc-camel-view-box=\"0 0 150 150\"><use href=\"#cow\" width=\"150\" height=\"150\"><\u002Fuse><\u002Fsvg>\n<div style=\"position: absolute; left: 138px; top: 2px; transform: rotate(-8deg); background: #fff; border: 2.5px solid #4A3F5C; border-radius: 999px; padding: 3px 14px; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 17px\">moo<\u002Fdiv>\n<div style=\"flex: 1; text-align: center; padding-bottom: 6px\">\n<div style=\"font-family: 'Fredoka', sans-serif; font-size: 24px; font-weight: 500; letter-spacing: 0.05em\">Para:<\u002Fdiv>\n<div style=\"font-family: 'Fredoka', sans-serif; font-size: 32px; font-weight: 600; line-height: 1.25; color: {{accent}}\">Mi bonita flor azul,<br>pecas de estrella,<br>mi cocona, mi bonita<\u002Fdiv>\n<div style=\"display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: 8px\">\n<svg aria-hidden=\"true\" width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\"><use href=\"#star\" width=\"24\" height=\"24\"><\u002Fuse><\u002Fsvg>\n<svg aria-hidden=\"true\" width=\"30\" height=\"30\" sc-camel-view-box=\"0 0 40 40\"><use href=\"#flor\" width=\"40\" height=\"40\"><\u002Fuse><\u002Fsvg>\n<svg aria-hidden=\"true\" width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\"><use href=\"#star\" width=\"24\" height=\"24\"><\u002Fuse><\u002Fsvg>\n<\u002Fdiv>\n<\u002Fdiv>\n<svg aria-hidden=\"true\" width=\"150\" height=\"150\" sc-camel-view-box=\"0 0 150 150\"><use href=\"#pingu\" width=\"150\" height=\"150\"><\u002Fuse><\u002Fsvg>\n<\u002Fdiv>\n\n<div style=\"position: relative; margin-top: 56px; background: #fff; border: 3px dashed #8EC5F0; border-radius: 32px; padding: 40px 46px; display: flex; flex-direction: column; gap: 18px; font-size: 19px; line-height: 1.65\">\n<svg aria-hidden=\"true\" width=\"96\" height=\"96\" sc-camel-view-box=\"0 0 100 100\" style=\"position: absolute; top: -74px; right: 150px\"><use href=\"#tortu\" width=\"100\" height=\"100\"><\u002Fuse><\u002Fsvg>\n<div style=\"position: absolute; right: -22px; top: 36%; transform: rotate(7deg); background: #fff; border: 2.5px solid #4A3F5C; border-radius: 999px; padding: 3px 14px; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 17px\">moo<\u002Fdiv>\n<div style=\"position: absolute; left: -22px; bottom: 90px; transform: rotate(-7deg); background: #fff; border: 2.5px solid #4A3F5C; border-radius: 999px; padding: 3px 14px; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 17px\">moo<\u002Fdiv>\n<p style=\"margin: 0\">Amor mío, te amo con todo mi corazón. Independientemente de cualquier cosa, quiero que sepas, y externarte con esta carta, lo irremplazable que eres para mí.<\u002Fp>\n<p style=\"margin: 0\">Contigo he vivido muchísimas cosas. Muchas de ellas están plasmadas en esta página donde se albergan nuestras cartas; muchas otras vivencias no. Me has acompañado en mi crecer, en el final de mis estudios universitarios, incluso cuando ya no he dado más. Cuando has tenido dinero, me has dado de todo lo que ha habido en tus manos; me has entregado todo lo que ha sido posible de ti: tu amor, tu paciencia, tu confidencia. Espero demostrarte que es recíproco: doy todo por ti y lo seguiré dando en épocas buenas y no tan buenas.<\u002Fp>\n<p style=\"margin: 0\">Y lo siento. A veces sé que puedo llegar a ser bobo o brusco, y no transmito todo lo suficientemente bien; o a veces no me mido con las cosas que puedo llegar a decir, y tú no tienes por qué aguantar estas cosas, pero aun así lo haces, y te lo agradezco de todo corazón.<\u002Fp>\n<p style=\"margin: 0\">Con esta carta pretendo externarte todo mi amor, todos mis sentimientos, que tal vez a veces no sé cómo transmitir, pero que mediante esta carta quedan plasmados. Porque te amo con todo mi corazoncito de pollo, y me duelen las pocas veces que no lo demuestro lo suficiente.<\u002Fp>\n<p style=\"margin: 6px 0 0; text-align: center; font-family: 'Fredoka', sans-serif; font-size: 24px; font-weight: 500; line-height: 1.4; color: {{accent}}\">Te amo, lo siento y te agradezco por ser mi pareja, porque me gustas tú y todo tú.<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"position: relative; margin-top: auto; display: flex; align-items: flex-end; justify-content: center; gap: 16px\">\n<svg aria-hidden=\"true\" width=\"110\" height=\"110\" sc-camel-view-box=\"0 0 100 100\"><use href=\"#tortu\" width=\"100\" height=\"100\"><\u002Fuse><\u002Fsvg>\n<svg aria-hidden=\"true\" width=\"30\" height=\"30\" sc-camel-view-box=\"0 0 24 24\" style=\"margin-bottom: 40px\"><use href=\"#heart\" width=\"24\" height=\"24\"><\u002Fuse><\u002Fsvg>\n<svg aria-hidden=\"true\" width=\"130\" height=\"130\" sc-camel-view-box=\"0 0 100 100\"><use href=\"#cow\" width=\"100\" height=\"100\"><\u002Fuse><\u002Fsvg>\n<svg aria-hidden=\"true\" width=\"30\" height=\"30\" sc-camel-view-box=\"0 0 24 24\" style=\"margin-bottom: 40px\"><use href=\"#heart\" width=\"24\" height=\"24\"><\u002Fuse><\u002Fsvg>\n<svg aria-hidden=\"true\" width=\"120\" height=\"120\" sc-camel-view-box=\"0 0 100 100\"><use href=\"#pingu\" width=\"100\" height=\"100\"><\u002Fuse><\u002Fsvg>\n<div style=\"position: absolute; left: 50%; bottom: 112px; margin-left: -20px; transform: rotate(-6deg); background: #fff; border: 2.5px solid #4A3F5C; border-radius: 999px; padding: 3px 14px; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 17px\">moo<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<sc-if data-dc-static=\"\" value=\"{{ false }}\"> ill=\"#A8DDB5\"><\u002Fcircle>\n<\u002Fg>\n<path d=\"M50 47 V62 M31 54 L40 66 M69 54 L60 66 M30 80 Q50 70 70 80\" fill=\"none\" stroke=\"#4A3F5C\" stroke-width=\"2.5\" stroke-linecap=\"round\" opacity=\"0.55\"><\u002Fpath>\n<circle cx=\"41\" cy=\"33\" r=\"4\" fill=\"#4A3F5C\"><\u002Fcircle>\n<circle cx=\"59\" cy=\"33\" r=\"4\" fill=\"#4A3F5C\"><\u002Fcircle>\n<circle cx=\"42.4\" cy=\"31.6\" r=\"1.4\" fill=\"#fff\"><\u002Fcircle>\n<circle cx=\"60.4\" cy=\"31.6\" r=\"1.4\" fill=\"#fff\"><\u002Fcircle>\n<path d=\"M45 41 Q50 46 55 41\" fill=\"none\" stroke=\"#4A3F5C\" stroke-width=\"2.5\" stroke-linecap=\"round\"><\u002Fpath>\n<circle cx=\"33\" cy=\"40\" r=\"4.5\" fill=\"#FF9CB3\" opacity=\"0.8\"><\u002Fcircle>\n<circle cx=\"67\" cy=\"40\" r=\"4.5\" fill=\"#FF9CB3\" opacity=\"0.8\"><\u002Fcircle>\n<\u002Fsymbol>\n<symbol id=\"flor-dc-static\" viewBox=\"0 0 40 40\">\n<g fill=\"#8EC5F0\" stroke=\"#4A3F5C\" stroke-width=\"1.8\">\n<circle cx=\"20\" cy=\"10\" r=\"7\"><\u002Fcircle>\n<circle cx=\"30\" cy=\"17\" r=\"7\"><\u002Fcircle>\n<circle cx=\"26\" cy=\"29\" r=\"7\"><\u002Fcircle>\n<circle cx=\"14\" cy=\"29\" r=\"7\"><\u002Fcircle>\n<circle cx=\"10\" cy=\"17\" r=\"7\"><\u002Fcircle>\n<\u002Fg>\n<circle cx=\"20\" cy=\"20\" r=\"5\" fill=\"#FFE29A\" stroke=\"#4A3F5C\" stroke-width=\"1.8\"><\u002Fcircle>\n<\u002Fsymbol>\n<symbol id=\"star-dc-static\" viewBox=\"0 0 24 24\">\n<path d=\"M12 2l2.9 6.6 7.1.6-5.4 4.7 1.7 7-6.3-3.8-6.3 3.8 1.7-7L2 9.2l7.1-.6z\" fill=\"#FFD66B\" stroke=\"#4A3F5C\" stroke-width=\"1.6\" stroke-linejoin=\"round\"><\u002Fpath>\n<\u002Fsymbol>\n<symbol id=\"heart-dc-static\" viewBox=\"0 0 24 24\">\n<path d=\"M12 21s-8-5.3-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.7-8 11-8 11z\" fill=\"#FF9CB3\" stroke=\"#4A3F5C\" stroke-width=\"1.6\" stroke-linejoin=\"round\"><\u002Fpath>\n<\u002Fsymbol>\n<\u002Fsvg>\n\n<div style=\"position: relative; display: flex; align-items: flex-end; justify-content: space-between; gap: 16px\">\n<svg aria-hidden=\"true\" width=\"150\" height=\"150\" viewBox=\"0 0 150 150\"><use href=\"#cow-dc-static\" width=\"150\" height=\"150\"><\u002Fuse><\u002Fsvg>\n<div style=\"position: absolute; left: 138px; top: 2px; transform: rotate(-8deg); background: #fff; border: 2.5px solid #4A3F5C; border-radius: 999px; padding: 3px 14px; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 17px\">moo<\u002Fdiv>\n<div style=\"flex: 1; text-align: center; padding-bottom: 6px\">\n<div style=\"font-family: 'Fredoka', sans-serif; font-size: 24px; font-weight: 500; letter-spacing: 0.05em\">Para:<\u002Fdiv>\n<div style=\"font-family: 'Fredoka', sans-serif; font-size: 32px; font-weight: 600; line-height: 1.25; color: #3A78B8\">Mi bonita flor azul,<br>pecas de estrella,<br>mi cocona, mi bonita<\u002Fdiv>\n<div style=\"display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: 8px\">\n<svg aria-hidden=\"true\" width=\"22\" height=\"22\" viewBox=\"0 0 24 24\"><use href=\"#star-dc-static\" width=\"24\" height=\"24\"><\u002Fuse><\u002Fsvg>\n<svg aria-hidden=\"true\" width=\"30\" height=\"30\" viewBox=\"0 0 40 40\"><use href=\"#flor-dc-static\" width=\"40\" height=\"40\"><\u002Fuse><\u002Fsvg>\n<svg aria-hidden=\"true\" width=\"22\" height=\"22\" viewBox=\"0 0 24 24\"><use href=\"#star-dc-static\" width=\"24\" height=\"24\"><\u002Fuse><\u002Fsvg>\n<\u002Fdiv>\n<\u002Fdiv>\n<svg aria-hidden=\"true\" width=\"150\" height=\"150\" viewBox=\"0 0 150 150\"><use href=\"#pingu-dc-static\" width=\"150\" height=\"150\"><\u002Fuse><\u002Fsvg>\n<\u002Fdiv>\n\n<div style=\"position: relative; margin-top: 56px; background: #fff; border: 3px dashed #8EC5F0; border-radius: 32px; padding: 40px 46px; display: flex; flex-direction: column; gap: 18px; font-size: 19px; line-height: 1.65\">\n<svg aria-hidden=\"true\" width=\"96\" height=\"96\" viewBox=\"0 0 100 100\" style=\"position: absolute; top: -74px; right: 150px\"><use href=\"#tortu-dc-static\" width=\"100\" height=\"100\"><\u002Fuse><\u002Fsvg>\n<div style=\"position: absolute; right: -22px; top: 36%; transform: rotate(7deg); background: #fff; border: 2.5px solid #4A3F5C; border-radius: 999px; padding: 3px 14px; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 17px\">moo<\u002Fdiv>\n<div style=\"position: absolute; left: -22px; bottom: 90px; transform: rotate(-7deg); background: #fff; border: 2.5px solid #4A3F5C; border-radius: 999px; padding: 3px 14px; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 17px\">moo<\u002Fdiv>\n<p style=\"margin: 0\">Amor mío, te amo con todo mi corazón. Independientemente de cualquier cosa, quiero que sepas, y externarte con esta carta, lo irremplazable que eres para mí.<\u002Fp>\n<p style=\"margin: 0\">Contigo he vivido muchísimas cosas. Muchas de ellas están plasmadas en esta página donde se albergan nuestras cartas; muchas otras vivencias no. Me has acompañado en mi crecer, en el final de mis estudios universitarios, incluso cuando ya no he dado más. Cuando has tenido dinero, me has dado de todo lo que ha habido en tus manos; me has entregado todo lo que ha sido posible de ti: tu amor, tu paciencia, tu confidencia. Espero demostrarte que es recíproco: doy todo por ti y lo seguiré dando en épocas buenas y no tan buenas.<\u002Fp>\n<p style=\"margin: 0\">Y lo siento. A veces sé que puedo llegar a ser bobo o brusco, y no transmito todo lo suficientemente bien; o a veces no me mido con las cosas que puedo llegar a decir, y tú no tienes por qué aguantar estas cosas, pero aun así lo haces, y te lo agradezco de todo corazón.<\u002Fp>\n<p style=\"margin: 0\">Con esta carta pretendo externarte todo mi amor, todos mis sentimientos, que tal vez a veces no sé cómo transmitir, pero que mediante esta carta quedan plasmados. Porque te amo con todo mi corazoncito de pollo, y me duelen las pocas veces que no lo demuestro lo suficiente.<\u002Fp>\n<p style=\"margin: 6px 0 0; text-align: center; font-family: 'Fredoka', sans-serif; font-size: 24px; font-weight: 500; line-height: 1.4; color: #3A78B8\">Te amo, lo siento y te agradezco por ser mi pareja, porque me gustas tú y todo tú.<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"position: relative; margin-top: auto; display: flex; align-items: flex-end; justify-content: center; gap: 16px\">\n<svg aria-hidden=\"true\" width=\"110\" height=\"110\" viewBox=\"0 0 100 100\"><use href=\"#tortu-dc-static\" width=\"100\" height=\"100\"><\u002Fuse><\u002Fsvg>\n<svg aria-hidden=\"true\" width=\"30\" height=\"30\" viewBox=\"0 0 24 24\" style=\"margin-bottom: 40px\"><use href=\"#heart-dc-static\" width=\"24\" height=\"24\"><\u002Fuse><\u002Fsvg>\n<svg aria-hidden=\"true\" width=\"130\" height=\"130\" viewBox=\"0 0 100 100\"><use href=\"#cow-dc-static\" width=\"100\" height=\"100\"><\u002Fuse><\u002Fsvg>\n<svg aria-hidden=\"true\" width=\"30\" height=\"30\" viewBox=\"0 0 24 24\" style=\"margin-bottom: 40px\"><use href=\"#heart-dc-static\" width=\"24\" height=\"24\"><\u002Fuse><\u002Fsvg>\n<svg aria-hidden=\"true\" width=\"120\" height=\"120\" viewBox=\"0 0 100 100\"><use href=\"#pingu-dc-static\" width=\"100\" height=\"100\"><\u002Fuse><\u002Fsvg>\n<div style=\"position: absolute; left: 50%; bottom: 112px; margin-left: -20px; transform: rotate(-6deg); background: #fff; border: 2.5px solid #4A3F5C; border-radius: 999px; padding: 3px 14px; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 17px\">moo<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fsc-if><\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#3A78B8&quot;},&quot;$preview&quot;:{&quot;width&quot;:860,&quot;height&quot;:1480}}\">\nclass Component extends DCLogic {\nrenderVals() {\nreturn { accent: this.props.accent ?? '#3A78B8' };\n}\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
